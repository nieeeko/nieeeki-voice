[project]
name = "nieeeki-voice-core"
version = "0.1.0"
description = "nieeeki Voice-Core: Pipecat + Soniox STT/TTS + Claude"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,mcp,runner,silero,soniox,webrtc]>=1.12,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tzdata>=2026.5",
    "pyjwt[crypto]>=2.10",
    "cryptography>=42",  # devices.py (ECDSA-Pruefung) importiert es direkt; kam bisher nur ueber pyjwt[crypto]
    "mss>=10",
    "livekit-wakeword>=0.3,<0.4",
    "sounddevice>=0.5",
    "sherpa-onnx>=2.0,<3",
]
